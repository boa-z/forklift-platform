[workspace]
resolver = "2"
members = ["protocol", "daemon", "simulator"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "proprietary"

[workspace.dependencies]
protocol = { path = "protocol" }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
nix = { version = "0.29", features = ["socket", "poll", "fs", "term"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
